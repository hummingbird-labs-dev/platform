apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: platform-api
  namespace: applications
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: platform-api
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              name: ingress-nginx
      ports:
        - protocol: TCP
          port: 8080
