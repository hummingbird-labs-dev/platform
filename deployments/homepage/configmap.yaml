apiVersion: v1
kind: ConfigMap
metadata:
  name: homepage
  namespace: applications
  labels:
    app.kubernetes.io/name: homepage
data:
  kubernetes.yaml: |
    mode: cluster

  settings.yaml: |
    title: Hummingbird Labs
    subtitle: Platform Dashboard
    theme: dark
    color: slate
    layout:
      header:
        style: boxed
        columns: 4
      sidebar:
        position: left
        style: boxed
      card:
        style: boxed
    favicon: https://www.hummingbirdlabs.dev/favicon.ico
    background:
      image: https://images.unsplash.com/photo-1557672172-298e090d0f80?w=1920&q=80
      opacity: 0.1

  services.yaml: |
    - Platform:
        - API:
            href: https://platform-api.lan.hummingbirdlabs.dev
            description: Platform REST API
            icon: mdiApi
    - Infrastructure:
        - PVE:
            href: https://10.10.1.14:8006/
            description: Virtualization Platform
            icon: mdiServer
        - UniFi:
            href: https://192.168.0.1/
            description: Network Controller
            icon: mdiAccessPoint

  bookmarks.yaml: |
    - Docs:
        - Homepage Docs:
            icon: mdiBookOpen
            href: https://gethomepage.dev
        - Kubernetes Docs:
            icon: mdiKubernetes
            href: https://kubernetes.io/docs
    - GitHub:
        - Hummingbird Labs:
            icon: mdiGithub
            href: https://github.com/hummingbird-labs-dev

  widgets.yaml: |
    - kubernetes:
        cluster:
          show: true
          cpu: true
          memory: true
          showLabel: true
          label: "cluster"
        nodes:
          show: true
          cpu: true
          memory: true
          showLabel: true
    - resources:
        backend: resources
        expanded: true
        cpu: true
        memory: true
        network: default
    - search:
        provider: google
        focus: true
        target: _blank

  custom.css: ""
  custom.js: ""
  docker.yaml: ""
