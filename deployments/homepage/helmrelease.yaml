apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: homepage
  namespace: applications
spec:
  interval: 30m
  releaseName: homepage
  chart:
    spec:
      chart: homepage
      sourceRef:
        kind: HelmRepository
        name: homepage
        namespace: flux-system
  install:
    crds: Create
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
  values:
    image:
      repository: ghcr.io/gethomepage/homepage
      tag: latest
    
    service:
      main:
        type: ClusterIP
        ports:
          http:
            port: 3000
    
    persistence:
      config:
        enabled: true
        type: emptyDir
        # To use persistent storage, replace with:
        # type: pvc
        # size: 1Gi
        # storageClass: "default"
        mountPath: /app/config
    
    resources:
      limits:
        cpu: 500m
        memory: 512Mi
      requests:
        cpu: 250m
        memory: 256Mi
    
    # Homepage configuration will be managed via ConfigMap
    # See configmap.yaml for dashboard and service definitions
