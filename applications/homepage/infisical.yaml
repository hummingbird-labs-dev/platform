apiVersion: secrets.infisical.com/v1beta1
kind: InfisicalStaticSecret
metadata:
  name: homepage
  namespace: applications
spec:
  infisicalAuthRef:
    name: applications
    namespace: applications
  syncOptions:
    refreshInterval: 60s
  sources:
    - projectSlug: hummingbirdlabs-dev-m77-b
      environmentSlug: prod
      secretPath: /lan/hostnames
  targets:
    - name: homepage-secret
      namespace: applications
      kind: Secret
      creationPolicy: Owner
      template:
        engineVersion: v1
        data:
          PLATFORM_API_URL: "{{ .PLATFORM_API_URL.Value }}"
          PROXMOX_URL: "{{ .PROXMOX_URL.Value }}"
          UNIFI_URL: "{{ .UNIFI_URL.Value }}"
          REGISTRY_URL: "{{ .REGISTRY_URL.Value }}"
          UPTIME_KUMA_STATUS_URL: "{{ .UPTIME_KUMA_STATUS_URL.Value }}"
          UPTIME_KUMA_URL: "{{ .UPTIME_KUMA_URL.Value }}"
