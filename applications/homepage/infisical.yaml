apiVersion: secrets.infisical.com/v1beta1
kind: InfisicalStaticSecret
metadata:
  name: homepage
  namespace: applications
spec:
  infisicalAuthRef:
    name: applications
    namespace: applications
  syncOptions:
    refreshInterval: 60s
  sources:
    - projectSlug: hummingbirdlabs-dev-m77-b
      environmentSlug: prod
      secretPath: /lan/hostnames
  targets:
    - name: homepage-secret
      namespace: applications
      kind: Secret
      creationPolicy: Owner
      template:
        engineVersion: v1
        data:
          HOMEPAGE_VAR_PLATFORM_API_URL: "{{ .HOMEPAGE_VAR_PLATFORM_API_URL.Value }}"
          HOMEPAGE_VAR_PVE_URL: "{{ .HOMEPAGE_VAR_PVE_URL.Value }}"
          HOMEPAGE_VAR_UNIFI_URL: "{{ .HOMEPAGE_VAR_UNIFI_URL.Value }}"
          HOMEPAGE_VAR_REGISTRY_URL: "{{ .HOMEPAGE_VAR_REGISTRY_URL.Value }}"
          HOMEPAGE_VAR_UPTIME_KUMA_STATUS_URL: "{{ .HOMEPAGE_VAR_UPTIME_KUMA_STATUS_URL.Value }}"
          HOMEPAGE_VAR_UPTIME_KUMA_URL: "{{ .HOMEPAGE_VAR_UPTIME_KUMA_URL.Value }}"
