apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: uptime-kuma
  namespace: applications
  labels:
    app.kubernetes.io/name: uptime-kuma
spec:
  ingressClassName: nginx
  rules:
    - host: "{{ .UPTIME_KUMA_URL_HOST }}"  # templated by InfisicalStaticSecret via uptime-kuma-secret (see infisical.yaml)
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: uptime-kuma
                port:
                  number: 80
