apiVersion: secrets.infisical.com/v1beta1
kind: InfisicalStaticSecret
metadata:
  name: platform-api
  namespace: applications
spec:
  infisicalAuthRef:
    name: applications
    namespace: applications
  syncOptions:
    refreshInterval: 60s
  sources:
    - projectSlug: hummingbirdlabs-dev-m77-b
      environmentSlug: prod
      secretPath: /lan/hostnames
  targets:
    - name: platform-api-secret
      namespace: applications
      kind: Secret
      creationPolicy: Owner
      template:
        engineVersion: v1
        data:
          PLATFORM_API_INGRESS_HOST: '{{ .PLATFORM_API_URL.Value | trimPrefix "https://" | trimPrefix "http://" | trimSuffix "/" }}'
