apiVersion: v1
kind: PersistentVolume
metadata:
  name: airflow-postgres
  labels:
    app.kubernetes.io/part-of: airflow
    app.kubernetes.io/component: postgres
spec:
  capacity:
    storage: 10Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: infisical-manual
  local:
    path: /opt/airflow/postgres
  selector:
    matchLabels:
      app.kubernetes.io/component: primary
      app.kubernetes.io/name: postgresql
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - k8s-node-1
---
apiVersion: v1
