apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: airflow
  namespace: applications
spec:
  interval: 10m
  chart:
    spec:
      chart: airflow
      version: '1.x.x'
      sourceRef:
        kind: HelmRepository
        name: airflow-repo
        namespace: flux-system
  values:
    # Default image
    defaultAirflowRepository: apache/airflow
    defaultAirflowTag: '2.9.1'

    # Database configuration
    postgresql:
      enabled: true
      auth:
        username: airflow
        password: airflow
        database: airflow
      primary:
        persistence:
          enabled: true
          size: 10Gi
          storageClassName: infisical-manual
          selector:
            matchLabels:
              app.kubernetes.io/component: postgres

    # Executor configuration
    executor: KubernetesExecutor

    # RBAC for KubernetesExecutor
    rbac:
      create: true

    # Logs configuration
    logs:
      persistence:
        enabled: true
        size: 10Gi
        storageClassName: infisical-manual
        selector:
          matchLabels:
            app.kubernetes.io/component: logs

    # PVC for DAGs
    dags:
      persistence:
        enabled: true
        size: 5Gi
        storageClassName: infisical-manual
        selector:
          matchLabels:
            app.kubernetes.io/component: dags
      gitSync:
        enabled: false

    # Security context
    podSecurityContext:
      runAsUser: 50000
      runAsGroup: 0
      fsGroup: 50000

    containerSecurityContext:
      runAsUser: 50000
      runAsNonRoot: true
      allowPrivilegeEscalation: false
