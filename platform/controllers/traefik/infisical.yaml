apiVersion: secrets.infisical.com/v1beta1
kind: InfisicalStaticSecret
metadata:
  name: traefik-credentials
  namespace: applications
spec:
  infisicalAuthRef:
    name: applications
    namespace: applications
  syncOptions:
    refreshInterval: 60s
  sources:
    - projectSlug: hummingbirdlabs-dev-m77-b
      environmentSlug: prod
      secretPath: /credentials
  targets:
    - name: traefik-credentials
      namespace: traefik
      kind: Secret
      creationPolicy: Orphan
      template:
        engineVersion: v1
        data:
          CLOUDFLARE_API_TOKEN: "{{ .CLOUDFLARE_API_TOKEN.Value }}"
          HUMMINGBIRD_LABS_EMAIL: "{{ .HUMMINGBIRD_LABS_EMAIL.Value }}"
