apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traefik
  namespace: traefik
spec:
  interval: 10m
  releaseName: traefik
  targetNamespace: traefik
  chart:
    spec:
      chart: traefik
      version: ">=30.0.0"
      sourceRef:
        kind: HelmRepository
        name: traefik
        namespace: flux-system
  values:
    # Set Traefik as your default Ingress controller
    ingressClass:
      enabled: true
      isDefaultClass: true

    # Redirect all HTTP to HTTPS
    ports:
      web:
        http:
          redirections:
            entryPoint:
              to: websecure
              scheme: https
              permanent: true
      websecure:
        http:
          tls:
            enabled: true
            # certResolver: "cloudflare" # Uncomment to make this the default cert resolver

    # Add the DNS challenge configuration to Traefik arguments
    additionalArguments:
      - "--certificatesresolvers.cloudflare.acme.dnschallenge=true"
      - "--certificatesresolvers.cloudflare.acme.dnschallenge.provider=cloudflare"
      - "--certificatesresolvers.cloudflare.acme.email=$(HUMMINGBIRD_LABS_EMAIL)"
      - "--certificatesresolvers.cloudflare.acme.storage=/data/acme.json"
    
    # Store certificates on a persistent volume so they survive pod restarts
    persistence:
      enabled: true
      name: data
      size: 128Mi
      path: /data

    # This is where you inject your API token from Infisical
    envFrom:
      - secretRef:
          name: traefik-credentials
