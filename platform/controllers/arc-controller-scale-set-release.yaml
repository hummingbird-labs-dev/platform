apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: arc-runner-set
  namespace: flux-system
spec:
  interval: 1h
  # Ensures the controller runs first
  dependsOn:
    - name: arc-controller
  chart:
    spec:
      chart: gha-runner-scale-set
      version: "0.9.3" # Match the controller version
      sourceRef:
        kind: HelmRepository
        name: actions-runner-controller-charts
        namespace: flux-system
  install:
    createNamespace: true
  targetNamespace: arc-runners
  values:
    githubConfigUrl: "https://github.com"
    githubConfigSecret:
      # 1. References the Kubernetes secret name
      name: arc-github-token
      # 2. Instructs the chart template validation engine which key to look for inside that secret
      github_token: ""
