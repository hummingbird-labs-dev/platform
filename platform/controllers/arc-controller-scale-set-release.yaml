apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: arc-runner-set
  namespace: arc-controller
spec:
  interval: 1h
  dependsOn:
    - name: arc-controller
      namespace: arc-controller
  chart:
    spec:
      chart: gha-runner-scale-set
      version: "0.9.3"
      sourceRef:
        kind: HelmRepository
        name: actions-runner-controller-charts
        namespace: flux-system
  install:
    crds: Create
    createNamespace: true
  upgrade:
    crds: CreateReplace
  values:
    runnerScaleSetName: "arc-runner-set"
    githubConfigUrl: "https://github.com/hummingbird-labs-dev" # Update with your org
    githubConfigSecret:
      name: arc-github-token
      key: github_token
