apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: arc-runner-set
  namespace: arc-system
spec:
  interval: 1h
  dependsOn:
    - name: arc-controller
      namespace: arc-system
  chart:
    spec:
      chart: gha-runner-scale-set
      version: "0.14.2"
      sourceRef:
        kind: HelmRepository
        name: actions-runner-controller-charts
        namespace: arc-system
  install:
    crds: Create
    createNamespace: true
  upgrade:
    crds: CreateReplace
  values:
    runnerScaleSetName: "arc-runner-set"
    githubConfigUrl: "https://github.com/hummingbird-labs-dev"
    githubConfigSecret: arc-github-token
    minRunners: 1
    maxRunners: 10
    containerMode:
      type: dind
    runnerNamespace: arc-runners
