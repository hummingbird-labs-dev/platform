apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: arc-controller
  namespace: arc-system
spec:
  interval: 1h
  chart:
    spec:
      chart: gha-runner-scale-set-controller
      version: "0.9.3"
      sourceRef:
        kind: HelmRepository
        name: actions-runner-controller-charts
        namespace: arc-system
  install:
    crds: Create
    createNamespace: true
  upgrade:
    crds: CreateReplace
  values: {}
