apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: secrets-operator
  namespace: infisical-secrets-operator
spec:
  interval: 10m
  releaseName: secrets-operator
  targetNamespace: infisical-secrets-operator
  chart:
    spec:
      chart: secrets-operator
      version: "0.10.x"
      sourceRef:
        kind: HelmRepository
        name: infisical
        namespace: flux-system
  values:
    installCRDs: true
