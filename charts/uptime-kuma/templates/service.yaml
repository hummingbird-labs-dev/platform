apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.nameOverride | default "uptime-kuma" }}
  labels:
    app.kubernetes.io/name: uptime-kuma
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: uptime-kuma
