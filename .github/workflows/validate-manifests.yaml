name: Validate manifests

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  kustomize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Kustomize configuration
        run: |
          kubectl kustomize gitops
          kubectl kustomize platform
          kubectl kustomize platform/namespaces
          kubectl kustomize deployments
      - name: Lint and render Spring Boot API chart
        run: |
          helm lint packages/spring-boot-api
          helm template spring-boot-api packages/spring-boot-api > /dev/null
